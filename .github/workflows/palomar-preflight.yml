name: Palomar mechanical preflight

# Manual full verification of the published commit by Palomar's pinned
# verifier on a GitHub-hosted runner (profile palomar-standard-v1: 4 CPUs,
# 16 GiB). Local results recorded under lean/verification are separate
# evidence; this workflow supplies its own hosted result.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@65f0154ed776cd26c224254aa57b379137f28b0d
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 65f0154ed776cd26c224254aa57b379137f28b0d
      request_id: preflight001
      mode: full
      execution_profile: palomar-standard-v1
      options: >-
        {"project_path":"lean","formalization_metadata_path":"lean/formalization.yaml","comparator_config_path":"lean/comparator-zeta241.json","authorization_relationship":"I am a responsible author or maintainer"}
