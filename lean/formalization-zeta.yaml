fidelity:
  divergences: One displayed scalar zeta/logarithmic-derivative inequality on a fixed independently
    defined field remains unproved. The exact exponent 2083647/2000000, ordinary Euclidean plane,
    unordered unit pairs and both sequence limits are preserved. No structural or asymptotic assertion
    is packaged as a numerical input, and no theorem for every sufficiently large cardinality
    is asserted.
