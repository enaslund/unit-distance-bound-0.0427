    actual definitions and the proof dependencies. A separate audit on 2026-09-22 by 19
    adversarial verifier agents (Claude Fable 5.1) confirmed statement fidelity, the
    Comparator semantics of the Challenge, the bridge from the manuscript's computer-assisted
    certificate to hypothesis (H), the mass identity and the geometric margin numerically,
