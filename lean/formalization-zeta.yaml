version: v0.4
project:
  name: Planar unit distances from one fixed zeta inequality
  description: >-
    Conditional theorem on unit distances in the Euclidean plane. Let K be the
    number field of degree 524288 = 2^19 generated over Q by square roots of
    -1, 2, 3, 5, 7, 11 and 13 and by square roots of twelve explicit products
    of elements x_i + y_i g(m_i) of that multiquadratic field. Hypothesis (H)
    is one displayed numerical inequality for the Dedekind zeta function of K:
    log(Re zeta_K(1 + 1/12000))/524288
    + (1/12000)((L - gamma - log(4 pi))/4 - Re((zeta_K'/zeta_K)(2))/524288)
    < 42165819/10^9, where L = (9/4) log 2 + (1/2) log 15015 and gamma is
    Euler's constant. The compared theorem proves that (H) implies the
    existence of finite sets U_j in the plane with |U_j| -> infinity such that
    the number of unordered pairs of points of U_j at distance one, divided by
    |U_j|^(2083647/2000000), tends to infinity. The exponent is exactly
    2083647/2000000 = 1.0418235. The conclusion is a sequence statement only;
    no bound at every sufficiently large cardinality is asserted. The infinite
    pro-2 field family, its root-discriminant bound, the analytic transfer, the
    pair-integral certificates and the planar construction are proved in Lean
    over Mathlib; (H) itself is not proved. The hypothesis is motivated by the
    manuscript's computer-assisted certificate, which bounds its left-hand side
    by 0.0421618189 outside Lean; that computation is not part of the formal
    proof.
  authors:
  - Eric Naslund
  responsible_maintainers:
  - Eric Naslund
  license: Apache-2.0
