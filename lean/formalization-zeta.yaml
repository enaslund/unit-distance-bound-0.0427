sources:
- title: A lower exponent of 1.0418235 for planar unit distances
  authors:
  - Eric Naslund
  id: https://github.com/enaslund/unit-distance-bound-0.0427/blob/cb7f1af7c4330b60b169473c823f196d55875d95/papers/0.0418235/main.tex
  type: paper
  location: 'Public repository: papers/0.0418235/ at the cited commit. Exported
    formalization package: docs/manuscript/; especially sections/tower.tex, analytic.tex,
    geometry.tex and finite-windows.tex'
  relationship: adapts
  author_endorsement: participated
  note: >-
    The manuscript claims the unconditional planar sequence theorem with exponent
    2083647/2000000 by a computer-assisted certificate. This formalization adapts it:
    the exact sequence conclusion is derived subject to one displayed fixed-field
    zeta/logarithmic-derivative inequality (H) that remains unproved, and the sufficient
    pair-integral bound uses threshold 0.042165819 in place of the manuscript's
    0.042161819. The manuscript is an unrefereed preprint; its AI Methodology statement
    says that the work was done with extensive AI use, with agents developing the
    mathematics and writing the paper, and that the listed author is the human
    responsible for having supervised and prompted the AI agents that produced it. It
    has not been peer reviewed. A copy (main.tex, sections/, references.bib, main.pdf) is
    included in the exported formalization package under docs/manuscript/;
    the public manuscript is available at the immutable identifier above.
    Historical research provenance remains enaslund/unit-distance-bound, commit
    eec70fd25ebe045c5df1c98370d613eaa3719c0c; that research repository was private
    on 2026-09-22. author_endorsement participated records only
    that the manuscript's sole author is the owner who commissioned and directed this
    autonomous formalization. On 2026-09-27 the owner authorized publication in
    enaslund/unit-distance-bound-0.0418; that repository was deleted on 2026-09-30,
    and the manuscript is published at the identifier above. The authorization does
    not assert owner proof review or authorize Palomar submission or registration.
