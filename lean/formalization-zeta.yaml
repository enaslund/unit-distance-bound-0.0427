- id: https://github.com/kim-em/erdos-unit-distance-comparator/tree/6f54548da16c3f243d7e300716795906b955271a
  relationship: independent
  note: Registered in the Palomar registry as PALOMAR-2026-08-08-000001 (2026-08-08); a
    Comparator wrapper for the library kim-em/erdos-unit-distance at
    34b4587bbd0740efb9c06a519a8ee14a3eff8cd7. It proves the uniform-constant form of the
    disproof of the Erdős unit-distance conjecture (for every C > 0, arbitrarily large n
    admit n-point planar sets with more than n^(1 + C/log log n) unit-distance pairs), a
    different and weaker statement than the fixed exponent here. No code or theorem from it
    is used.
