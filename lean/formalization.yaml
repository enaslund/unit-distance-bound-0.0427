    the interval corrections of its certificates of October 2, 2026,
    for the tower over Q(sqrt 241) with the Frobenius cap at the prime 7: the tower, the Kummer field of
    the tower (called the genus field here) and its 255 quadratic L-functions, the upper bound for the relative
    zeta value, the geometric construction and the proof of the main theorem. It proves the exponent 1.04273
    unconditionally, with a computer-assisted certificate. Version 1 of this formalization proved the exponent
    1.0427 conditional on an inequality (H241) for the genus field; version 2 reuses its tower, genus field,
    analytic machinery and geometric construction with the changes of the 1.043171 paper. It is an unrefereed
    manuscript produced with AI tools under Eric Naslund''s direction, with an AI Methodology statement on its
    first page, published in the repository cited above; it is not a peer-reviewed publication. No registry
    action is claimed by this metadata.'
