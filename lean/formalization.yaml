status:
  scope: 'Exact planar sequence theorem at exponent 20863/20000 conditional on one displayed zeta/logarithmic-derivative
    inequality for the field E_W of degree 8192, with threshold 50969/1000000 at 1 + 1/4411. The conditional
    implication is the selected result and (H_W) remains unproved. In the research repository, lake build of
    the default targets and of the whole library succeeded on 2026-10-08, and #print axioms of the selected
    theorem, of the library theorem UnitDistance.Sqrt241.V2.target_of_wide_zeta_bound and of the local data
    of E_W reports only the three permitted axioms. Imported axiom queries on Lean 4.35.0-rc2 have the
    limitation documented by Lean issue 15226; they are reported query results rather than an independent
    exhaustive axiom audit. The complete pinned pipeline has not been run on this version; this archive needs
    its own complete verification, and no result of version 1 verifies it or proves (H_W). The axiom lists
    below specify the selected permitted policy. The archive also contains the earlier conditional theorem
    at exponent 2083647/2000000 (ChallengeZeta/SolutionZeta, comparator-zeta.json, formalization-zeta.yaml)
    as an unselected companion. See README.md for the current verification state and docs/sqrt241/SUBMISSION.md
