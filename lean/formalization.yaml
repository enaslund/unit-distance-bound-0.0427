# Metadata of the 1.04315 conditional theorem. It follows the formalization of the 1.0427 theorem,
# registered as PALOMAR-2026-10-01-000018 version 1 from the same repository and paths.
# Local Git identifiers describe provenance; they do not assert public availability.
# Submission, registration and owner proof review are not claimed.
version: v0.4
project:
  name: 'An Exponent of 1.043 for the Unit Distance Problem: Lean formalization at exponent 1.04315, conditional on one zeta inequality'
  description: 'Lean formalization accompanying the paper An Exponent of 1.043 for the Unit Distance Problem by
    Eric Naslund (cited under sources), which proves the exponent 1.043171 unconditionally with a computer-assisted
    certificate. Conditional theorem on unit distances in the Euclidean plane. Let B = Q(sqrt 241) and let E
    be the number field of degree 512 generated over Q by sqrt 241 and square roots of the eight elements -1,
    -71011068 + 4574225 sqrt 241, (-6101 - 393 sqrt 241)/2, (6101 - 393 sqrt 241)/2, 31 - 2 sqrt 241, 31 + 2
    sqrt 241, 326 - 21 sqrt 241 and 326 + 21 sqrt 241 of B (a basis of the {2,3,5}-units of B modulo squares).
    Let E_W be the field of degree 8192 obtained from E by adjoining square roots of four explicit elements
    beta_1, ..., beta_4 of E, each generating with two of the square roots a dihedral extension of B of degree
    8 (the elements are written out in the Challenge). Hypothesis (H_W) is one displayed numerical inequality
    for the Dedekind zeta function of E_W: log(Re zeta_{E_W}(1 + 1/4411))/8192 + (1/4411)((L - gamma -
    log(4 pi))/4 - Re((zeta_{E_W}''/zeta_{E_W})(2))/8192) < 50969/1000000, where L = (9/4) log 2 + (1/2) log
    3615 and gamma is Euler''s constant. The compared theorem proves that (H_W) implies the existence of finite
    sets U_j in the plane with |U_j| -> infinity such that the number of unordered pairs of points of U_j at
    distance one, divided by |U_j|^(20863/20000), tends to infinity. The exponent is exactly 20863/20000 =
    1.04315. The conclusion is a sequence statement only; no bound at every sufficiently large cardinality
    is asserted. The infinite pro-2 tower over B with Frobenius caps at both primes above 29 and at one prime
    above 41 (generators, relation bound, presentation, Golod-Shafarevich infinitude, local data), its fields,
    which are Galois over B and over a fixed base field but not over Q, their local types and signature,
    the root-discriminant bound, the field E_W with its degree, its embedding in the base field and its local
    data, the passage from (H_W) to the analytic ceiling, the numerical margin and the planar construction
    are proved in Lean over Mathlib; (H_W) itself is not proved. Outside Lean, a rigorous computation
    (certified values of the 576 L-functions of degrees 4 and 8 in the factorization of zeta_{E_W} and an
    Euler product with explicit tail) bounds the left side of (H_W) by 0.0509172; that computation is not
    part of the formal proof. The earlier formalization registered as PALOMAR-2026-10-01-000018 version 1
    proved the exponent 10427/10000 from a different inequality, for the field E.'
  authors:
  - Eric Naslund
  responsible_maintainers:
  - Eric Naslund
  license: Apache-2.0
