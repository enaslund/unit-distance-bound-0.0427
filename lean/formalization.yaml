  scope: 'Exact planar sequence theorem at exponent 10427/10000 conditional on one displayed genus-field
    zeta/logarithmic-derivative inequality with ceiling 852/10000. The conditional implication is the
    selected result and H remains unproved. Candidate 4 of this development (research commit
    697c3cd7801431d594c01785f2b3e88dd248576d) passed the complete pinned local pipeline under the
    16-CPU/32-GiB profile. The present sources add proof-internal certificate splits for the
    4-CPU/16-GiB profile; con-ron, NanoDa and the Lean kernel each accepted their Solution export
    within 4 CPUs and 16 GiB, and imported axiom queries over the 57,394 project and 32 submission
    declarations of the closure report only the three permitted axioms. Imported collectAxioms queries
    on Lean 4.35.0-rc2 have the limitation documented by Lean issue 15226; they are reported query
    results rather than an independent exhaustive axiom audit. This archive needs its own complete
    verification; no earlier result establishes that run or proves H. The axiom lists below specify
    the selected permitted policy. The archive also contains the earlier conditional theorem at
    exponent 2083647/2000000 (ChallengeZeta/SolutionZeta, comparator-zeta.json, formalization-zeta.yaml)
    as an unselected companion. See README.md for the current verification state and
    docs/sqrt241/SUBMISSION.md for the development account.'
