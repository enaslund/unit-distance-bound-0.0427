fidelity:
  divergences: >-
    The manuscript's externally computer-assisted exponent is 1.04273. This
    formalization proves the sequence implication at exact exponent 10427/10000
    = 1.0427 from one explicit numerical inequality on the independently defined
    degree-512 genus field. That inequality remains unproved in Lean. Ordinary
    Euclidean distance, unordered unit pairs and both sequence limits are retained;
    no conclusion for every sufficiently large cardinality is asserted.
