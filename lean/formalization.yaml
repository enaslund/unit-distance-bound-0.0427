fidelity:
  divergences: >-
    The manuscript's externally computer-assisted exponent is 1.043171. This
    formalization proves the sequence implication at exact exponent 20863/20000
    = 1.04315 from one explicit numerical inequality on the independently defined
    field E_W of degree 8192, with one abscissa 1 + 1/4411; the manuscript's census of
    primes to 4e13, signed kernel over 21 abscissae and general shell weights are not
    formalized. That inequality remains unproved in Lean. Ordinary Euclidean distance,
    unordered unit pairs and both sequence limits are retained; no conclusion for every
    sufficiently large cardinality is asserted.
