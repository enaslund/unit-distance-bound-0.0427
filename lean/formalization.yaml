- title: An Exponent of 1.043 for the Unit Distance Problem
  authors:
  - Eric Naslund
  id: https://github.com/enaslund/unit-distance-bound-0.0427/blob/2586d6b97682cc4cb890e076d2c4906e27f421f9/papers/0.043171/main.tex
  type: paper
  location: 'Public repository enaslund/unit-distance-bound-0.0427: papers/0.043171/ at the cited commit
    (main.tex, sections/, certificates/). The source archive includes the manuscript, its research README and
    the external evidence for (H_W) (certificates/dihedral/h_w_receipt.py and .json) under docs/research-1.043171/.'
  relationship: adapts
  note: 'Self-contained manuscript of October 8, 2026, for the 41-cap tower over Q(sqrt 241): the tower with the
    Frobenius cap moved from the prime 7 to a prime above 41, the dihedral quotients of the tower group, the
    field E_W of degree 8192 (the paper''s E_{W''''}) and the factorization of its zeta function, the bound for
    the relative zeta value, the geometric construction and the proof of the main theorem. It proves the
    exponent 1.043171 unconditionally, with a computer-assisted certificate; this formalization proves the
    exponent 1.04315 conditional on the displayed hypothesis (H_W), with a single abscissa in place of the
    paper''s census to 4e13, signed kernel and general shell weights. Independent AI referee reviews found
    no error affecting the theorem. It is an unrefereed manuscript produced with AI tools under Eric Naslund''s
    direction, with an AI Methodology statement on its first page; it is not a peer-reviewed publication.
    His role as directing author and responsible maintainer does not assert human proof review. No registry
    action is claimed by this metadata.'
